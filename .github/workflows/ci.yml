name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Run tests
        run: npm test

      # Los .ps1 solo se ejecutan en Windows (instalador, backups, autoupdate): un error de
      # sintaxis pasaba inadvertido hasta producción. pwsh viene preinstalado en ubuntu-latest.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts/*.ps1, installer/*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { $bad++; Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($bad) { exit 1 }
